name: Build HEY OKA Android APK

on:
  push:
    branches:
      - feature/hey-oka-branding
    paths:
      - '.github/workflows/build-hey-oka-apk.yml'
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradlew'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hey-oka-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/hey-oka
          cp app/build/outputs/apk/debug/app-debug.apk dist/hey-oka/HEY-OKA-debug.apk
          cd dist/hey-oka
          sha256sum HEY-OKA-debug.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HEY-OKA-debug-APK
          path: dist/hey-oka/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
